version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: trackingdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  axonserver:
    image: axoniq/axonserver:latest
    container_name: axon-server
    ports:
      - "8024:8024"   # Axon Dashboard UI
      - "8124:8124"   # gRPC pour Spring Boot
    volumes:
      - axon-data:/axonserver/data
      - axon-events:/axonserver/events
      - axon-config:/axonserver/config
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8024"]
      interval: 10s
      timeout: 5s
      retries: 5

  tracking-service:
    build: .
    container_name: tracking-service
    depends_on:
      postgres:
        condition: service_healthy
      axonserver:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/trackingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      AXON_AXONSERVER_SERVERS: axon-server:8124
      SPRING_LIQUIBASE_ENABLED: "true"
    ports:
      - "8083:8083"
    networks:
      - app-network