databaseChangeLog:
  - changeSet:
      id: tracking-1
      author: junior
      changes:
        - createTable:
            tableName: tracking_entity
            columns:
              - column:
                  name: tracking_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: package_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: location_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: last_tracked
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: true